<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>授权位置查看</title>
<link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"></head>
<body><main class="wrap"><header><div><div class="eyebrow">Consented Location Sharing</div><h1>授权位置查看</h1></div><span class="pill">一对一 · 卡密访问</span></header>
<section id="login" class="card"><h2>输入访问卡密</h2><p class="muted">只有持有人主动开启位置共享后，才会显示位置。卡密由管理员生成，并设置到期时间。</p><form id="loginForm"><label for="card">访问卡密</label><input id="card" name="card" placeholder="XXXXX-XXXXX-XXXXX-XXXXX-XXXXX-XXXXX" required autocomplete="off" autocapitalize="characters"><button>验证并查看</button></form><p id="loginError" class="error" role="alert"></p></section>
<section id="viewer" class="hidden"><div class="card"><div class="row"><div><h2>设备最近位置</h2><span id="status" class="pill">正在加载…</span></div><button id="logout" class="secondary">退出</button></div><div id="map" aria-label="地图"></div><div class="statgrid"><div class="stat"><small>采集时间</small><b id="time">--</b></div><div class="stat"><small>位置精度</small><b id="accuracy">--</b></div><div class="stat"><small>纬度</small><b id="lat">--</b></div><div class="stat"><small>经度</small><b id="lng">--</b></div></div><p id="notice" class="muted">这里展示的是最后一次成功上传的位置，不代表一定是当前所在位置。</p><div class="link-row"><a id="appleMap" class="hidden" target="_blank" rel="noopener noreferrer">在苹果地图打开</a><a id="osmMap" class="hidden" target="_blank" rel="noopener noreferrer">在OpenStreetMap打开</a></div><button id="refresh" class="secondary">刷新最近位置</button></div>
<div class="card"><div class="row"><h2>历史轨迹</h2><div><label for="date">选择日期（UTC，测试版）</label><input id="date" type="date" style="margin-bottom:0"></div></div><p class="muted mini">仅显示已成功上传的真实采样点，缺失区段不会推断路线。</p><button id="historyButton" class="secondary">查看当天历史</button><p id="historyResult" class="muted"></p></div></section>
<footer class="muted mini">A端必须主动开启可见的位置共享。地图使用OpenStreetMap，地图服务可能接收到显示区域信息。测试版不代表原生iOS后台定位。</footer></main>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="/viewer.js"></script></body></html>
