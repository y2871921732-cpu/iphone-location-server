<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>卡密管理员</title><link rel="stylesheet" href="/styles.css"></head><body><main class="wrap"><header><div><div class="eyebrow">Admin Console</div><h1>访问卡密管理</h1></div><a href="/">返回查看页面</a></header>
<div class="card"><label for="secret">管理员密码（由服务器环境变量设定）</label><input id="secret" type="password" autocomplete="off" placeholder="ADMIN_PASSWORD"><p class="muted mini">密码仅用于本次请求，不会写入浏览器持久存储。</p></div>
<div class="card"><h2>生成新卡密</h2><p class="muted">生成新卡密后，之前的卡密及B端会话立即失效。单设备只有一个有效卡密。</p><label for="expires">卡密到期时间（按你浏览器本地时区）</label><input id="expires" type="datetime-local"><button id="create">生成并覆盖原卡密</button><p id="newcode" style="font-size:1.1rem;font-weight:750;word-break:break-all"></p><p id="createMessage" class="muted"></p></div>
<div class="card"><h2>查询或撤销</h2><div class="row"><button id="status" class="secondary">查看当前状态</button><button id="revoke" class="danger">立即撤销卡密</button></div><pre id="statusText" style="white-space:pre-wrap;word-break:break-word"></pre></div>
<p class="muted mini">本控制台为开发原型。正式上线前请添加管理员多因素认证、部署日志审计、备份与数据库权限管理。</p></main><script src="/admin.js"></script></body></html>
